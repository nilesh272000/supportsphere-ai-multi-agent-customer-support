[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supportsphere-ai"
version = "1.0.0"
description = "Modular multi-agent customer support orchestration demo"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SupportSphere AI"}]
dependencies = []

[project.scripts]
supportsphere = "supportsphere.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
